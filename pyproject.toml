[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "navigable-compute"
version = "0.9.0"
description = "Description-driven construction of verifiable navigable computational Grounds"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["navigable_compute*"]
