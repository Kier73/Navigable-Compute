[project]
name = "navigable-compute"
version = "0.1.0"
description = "Intent-first exact synthetic byte-machine navigation"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["navigable_compute*"]

