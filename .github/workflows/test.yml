name: Navigable-Compute conformance
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
      - run: python deep_demo.py
      - run: python possibility_demo.py
      - run: python invariant_demo.py
      - run: python self_space_demo.py
      - run: python reflective_demo.py
      - run: python reflective_architecture_demo.py
      - run: python semantic_language_demo.py
      - run: python preclosure_demo.py
      - run: python native_algebra_demo.py
      - run: python symbolic_quotient_demo.py
      - run: python nonlinear_koopman_demo.py
      - run: python realized_image_demo.py
      - run: python complexity_navigation_demo.py
      - run: python intention_fibre_demo.py
      - run: python adaptive_fibre_demo.py
      - run: python fibre_attention_demo.py
      - run: python adaptive_attention_demo.py
      - run: python procedural_vocabulary_demo.py
      - run: python symbolic_induction_demo.py
      - run: python induced_transversal_demo.py
      - run: python intention_cofactor_demo.py
