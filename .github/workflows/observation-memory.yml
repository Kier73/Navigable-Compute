name: NCR-014 native observation memory
on: [push, pull_request]
jobs:
  memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/Virtual-Ground-Interpreter
          ref: ae3f949b7d0b2aaa42236bc7cc37e9857384b174
          path: .vgi-source
          sparse-checkout: virtual_ground_interpreter
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: df75e8dee43c48c93bdca73637dada95c7d53f81
          path: .ecpu-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .vgi-source/virtual_ground_interpreter -e .ecpu-source -e .
      - run: python -m unittest discover -s integration -p test_observation_memory.py -v
      - run: python -m unittest discover -s integration -p test_attention_evidence.py -v
      - run: python -m unittest discover -s integration -p test_procedural_vocabulary_memory.py -v
